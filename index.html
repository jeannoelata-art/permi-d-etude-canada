<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi du permis d’études</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1a1f2b;--mut:#6b7280;--bd:#e2e5ee;--ac:#2563eb;--act:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#171b24;--tx:#e8eaf0;--mut:#9aa3b2;--bd:#2a3140;--ac:#5b8def;--act:#0e1117;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--in:#0f131b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#171b24;--tx:#e8eaf0;--mut:#9aa3b2;--bd:#2a3140;--ac:#5b8def;--act:#0e1117;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--in:#0f131b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 14px}h2{margin:0;font-size:1.25rem}h3{margin:0 0 10px;font-size:1rem;color:var(--ac)}
.mut{color:var(--mut);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 11px}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac)}
button.dng{color:var(--bad)}
input{font:inherit;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}
.names{display:flex;flex-direction:column;gap:8px}
.name{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 16px;font-size:1.05rem;border-radius:12px}
.add{margin-top:16px}
.big{width:100%;padding:12px;font-size:1rem}
.form{display:grid;gap:8px}.form input{width:100%}
.prog{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.prog div{height:100%;background:var(--ok);transition:width .3s}
.row{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok)}
.row.done .lab{text-decoration:line-through;color:var(--mut)}
.lab{font-weight:500}
.fields{grid-column:2;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fields label{display:flex;flex-direction:column;font-size:.72rem;color:var(--mut)}
.fields label input{width:100%;max-width:170px}
.fields input[type=number]{width:80px}
.act{display:flex;gap:6px}
.b{font-size:.7rem;padding:1px 8px;border-radius:99px;border:1px solid;margin-left:6px;white-space:nowrap}
.b.ok{color:var(--ok)}.b.bad{color:var(--bad)}.b.warn{color:var(--warn)}
.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
@media print{.noprint,button{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var KEY="permis_etudes_v1";
var DEF=[
["Préparation","Vérifier que l’école figure sur la liste des EED",7],
["Préparation","Passeport valide, toutes les pages scannées",5],
["Préparation","Acte de naissance",7],
["Préparation","Diplômes et relevés de notes",21],
["Préparation","Test de langue (si exigé par l’école)",30],
["Admission","Obtenir la lettre d’acceptation originale",30],
["Admission","Obtenir l’AAP 2026 (ou le CAQ pour le Québec)",21],
["Finances et lettre","Réunir les fonds minimum requis (vie + scolarité + transport)",30],
["Finances et lettre","Preuve de l’origine des fonds",14],
["Finances et lettre","Lettre de prise en charge et pièces du garant (si applicable)",7],
["Finances et lettre","Rédiger la lettre d’intention",10],
["Documents complémentaires","Examen médical",14],
["Documents complémentaires","Certificat de police",21],
["Documents complémentaires","Traductions certifiées",14],
["Documents complémentaires","Anciens visas et refus antérieurs déclarés",3],
["Documents complémentaires","Photo numérique conforme",3],
["Soumission","Relevés bancaires récents (4 à 6 mois)",7],
["Soumission","Créer le compte IRCC et obtenir la liste de contrôle",2],
["Soumission","Relecture finale (aucune contradiction)",3],
["Soumission","Téléverser tous les documents",2],
["Soumission","Payer les frais (150 $ permis + 85 $ biométrie)",1],
["Après le dépôt","Faire la biométrie (30 jours maximum)",7],
["Après le dépôt","Suivre le compte IRCC et répondre aux demandes",60],
["Arrivée","Logement, billet d’avion, assurance",30]
];
var V=null,adding=false;
var S=load();migrate();
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.people))return s}catch(e){}return{people:[],v:2}}
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function diff(s){return Math.round((new Date(s+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5)}
function cur(){return S.people.filter(function(p){return p.id===V})[0]}
function mk(name,school,spec){var t=today();return{id:uid(),name:name,school:school,spec:spec,start:t,items:DEF.map(function(x,i){return{id:uid(),sec:x[0],label:x[1],days:x[2],done:false,validated:"",deadline:i?"":addDays(t,x[2]),man:false}})}}
function cascade(p,i){var it=p.items[i],nx=p.items[i+1];if(nx&&!nx.man&&!nx.done)nx.deadline=it.done&&it.validated?addDays(it.validated,nx.days):""}
function migrate(){
  if(S.v===2)return;
  var ord={};DEF.forEach(function(x,i){ord[x[1]]=i});
  S.people.forEach(function(p){
    var last=-1;
    p.items.forEach(function(it,n){
      if(ord.hasOwnProperty(it.label)){it.k=ord[it.label];last=it.k;it.sec=DEF[it.k][0]}else it.k=last+0.5;
      it.n=n;
    });
    p.items.sort(function(a,b){return a.k-b.k||a.n-b.n});
    p.items.forEach(function(it){delete it.k;delete it.n});
    var f=p.items[0];if(f&&!f.man&&!f.done)f.deadline=addDays(p.start||today(),f.days);
    for(var i=0;i<p.items.length-1;i++)cascade(p,i);
  });
  S.v=2;save();
}
function home(){
  var h='<h1>🎓 Suivi du permis d’études</h1><div class="names">';
  h+=S.people.map(function(p){return '<button class="name" data-a="open" data-p="'+p.id+'"><span>'+esc(p.name)+'</span><span class="mut">›</span></button>'}).join("");
  h+='</div>';
  if(!S.people.length)h+='<div class="mut">Aucune personne pour l’instant.</div>';
  h+='<div class="add">';
  if(adding)h+='<div class="card"><div class="form"><input id="pn" placeholder="Nom complet"><input id="ps" placeholder="Établissement"><input id="pp" placeholder="Spécialité / programme"><button class="pri" data-a="addp">Créer</button><button data-a="canc">Annuler</button></div></div>';
  else h+='<button class="pri big" data-a="showadd">＋ Ajouter</button>';
  return h+'</div>';
}
function detail(p){
  var n=p.items.length,d=p.items.filter(function(i){return i.done}).length,pc=n?Math.round(d/n*100):0;
  var h='<div class="top noprint"><button data-a="back">← Retour</button><button data-a="prt">🖨 Imprimer</button></div><div class="card"><div class="head"><div><h2>'+esc(p.name)+'</h2><div class="mut">Établissement : '+esc(p.school||"non renseigné")+'</div><div class="mut">Spécialité : '+esc(p.spec||"non renseignée")+'</div></div><div class="act noprint"><button data-a="editp">Modifier</button><button class="dng" data-a="delp">Supprimer</button></div></div><div class="prog"><div style="width:'+pc+'%"></div></div><div class="mut">'+d+' / '+n+' étapes validées ('+pc+' %) · enregistrement automatique</div></div>';
  var last=null,secs=[];
  p.items.forEach(function(it,i){
    if(it.sec!==last){if(last!==null)h+="</div>";h+='<div class="card"><h3>'+esc(it.sec)+'</h3>';last=it.sec}
    if(secs.indexOf(it.sec)<0)secs.push(it.sec);
    var dd=it.deadline?diff(it.deadline):null,st="";
    if(it.done)st='<span class="b ok">Validé</span>';
    else if(dd!==null&&dd<0)st='<span class="b bad">En retard de '+(-dd)+' j</span>';
    else if(dd!==null&&dd<=3)st='<span class="b warn">Bientôt</span>';
    h+='<div class="row '+(it.done?"done":"")+'" data-i="'+i+'"><input type="checkbox" data-a="chk" '+(it.done?"checked":"")+'><div class="lab">'+(i+1)+'. '+esc(it.label)+st+'</div><div class="fields"><label>Validé le<input type="date" data-a="val" value="'+it.validated+'" '+(it.done?"":"disabled")+'></label><label>Date limite de soumission<input type="date" data-a="dl" value="'+it.deadline+'"></label><label>Délai (jours)<input type="number" min="0" data-a="days" value="'+it.days+'"></label><div class="act noprint"><button data-a="eit" title="Renommer">✎</button><button class="dng" data-a="dit" title="Supprimer">✕</button></div></div></div>';
  });
  if(last!==null)h+="</div>";
  h+='<div class="card noprint"><h3>＋ Ajouter une étape personnalisée</h3><div class="form"><input id="ns" list="secs" placeholder="Section (existante ou nouvelle)"><datalist id="secs">'+secs.map(function(s){return '<option value="'+esc(s)+'">'}).join("")+'</datalist><input id="nl" placeholder="Intitulé de l’étape"><input id="nd" type="number" min="0" value="7" title="Délai en jours"><button class="pri" data-a="addi">Ajouter l’étape</button></div></div>';
  return h;
}
function render(){var p=V?cur():null;if(V&&!p)V=null;$("#app").innerHTML=p?detail(p):home();window.scrollTo(0,0)}
function rerender(){var y=window.scrollY;var p=V?cur():null;$("#app").innerHTML=p?detail(p):home();window.scrollTo(0,y)}
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;var a=b.dataset.a,p=cur(),row=b.closest(".row"),i=row?+row.dataset.i:-1;
  if(a==="open"){V=b.dataset.p;render();return}
  if(a==="back"){V=null;adding=false;render();return}
  if(a==="showadd"){adding=true;render();var f=$("#pn");if(f)f.focus();return}
  if(a==="canc"){adding=false;render();return}
  if(a==="prt"){window.print();return}
  if(a==="addp"){var nm=$("#pn").value.trim();if(!nm){$("#pn").focus();return}S.people.push(mk(nm,$("#ps").value.trim(),$("#pp").value.trim()));adding=false;save();render();return}
  if(a==="editp"&&p){var x=prompt("Nom",p.name);if(x===null)return;p.name=x.trim()||p.name;x=prompt("Établissement",p.school);if(x!==null)p.school=x.trim();x=prompt("Spécialité",p.spec);if(x!==null)p.spec=x.trim()}
  else if(a==="delp"&&p){if(!confirm("Supprimer "+p.name+" et toute sa checklist ?"))return;S.people=S.people.filter(function(z){return z.id!==p.id});V=null;save();render();return}
  else if(a==="eit"&&p){var l=prompt("Nouvel intitulé",p.items[i].label);if(l===null||!l.trim())return;p.items[i].label=l.trim()}
  else if(a==="dit"&&p){if(!confirm("Supprimer cette étape ?"))return;p.items.splice(i,1);if(i>0)cascade(p,i-1)}
  else if(a==="addi"&&p){var lb=$("#nl").value.trim();if(!lb){$("#nl").focus();return}var sc=$("#ns").value.trim()||"Autres",it={id:uid(),sec:sc,label:lb,days:+$("#nd").value||0,done:false,validated:"",deadline:"",man:false},pos=-1;p.items.forEach(function(z,k){if(z.sec===sc)pos=k});if(pos<0){p.items.push(it);pos=p.items.length-1}else{p.items.splice(pos+1,0,it)}if(pos>0)cascade(p,pos)}
  else return;
  save();rerender();
});
document.addEventListener("change",function(e){
  var t=e.target,a=t.dataset.a,p=cur(),row=t.closest(".row");if(!a||!p||!row)return;
  var i=+row.dataset.i,it=p.items[i];
  if(a==="chk"){it.done=t.checked;it.validated=t.checked?today():"";cascade(p,i)}
  else if(a==="val"){it.validated=t.value||today();cascade(p,i)}
  else if(a==="dl"){it.deadline=t.value;it.man=!!t.value}
  else if(a==="days"){it.days=Math.max(0,+t.value||0);if(!it.man&&!it.done){var base=i===0?p.start:(p.items[i-1].done?p.items[i-1].validated:"");it.deadline=base?addDays(base,it.days):""}}
  save();rerender();
});
render();
</script>
</body>
</html>
